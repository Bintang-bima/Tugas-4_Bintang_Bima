<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Buat Account Baru</title>
</head>
<body>
<h2>Buat Account Baru</h2>
<h3>Sign Up Form</h3>

<form action="welcome.html" method="get">
<p>First name :<br>
<input type="text" name="firstname"></p>

<p>Last name :<br>
<input type="text" name="lastname"></p>

<p>Gender<br>
<input type="radio" name="gender" value="male"> Male<br>
<input type="radio" name="gender" value="female"> Female</p>

<p>Nationality<br>
<select name="nationality">
<option value="indonesia">Indonesia</option>
<option value="malaysia">Malaysia</option>
<option value="singapore">Singapore</option>
<option value="other">Other</option>
</select></p>

<p>Language Spoken<br>
<input type="checkbox" name="lang_id"> Bahasa Indonesia<br>
<input type="checkbox" name="lang_en"> English<br>
<input type="checkbox" name="lang_other"> Other</p>

<p>Bio<br>
<textarea name="bio" rows="6" cols="40"></textarea></p>

<p><input type="submit" value="Sign Up"></p>
</form>
</body>
</html>
